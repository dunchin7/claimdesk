# Workspace-root pyproject. Holds tool configs only; deps live in backend/.
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/app", "backend/tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # asserts in tests are fine
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S", "B"]
"scripts/**" = ["S", "T"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["backend/app/db/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["litellm.*", "instructor.*", "langfuse.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "smoke: integration-style tests that hit Azure OpenAI (require .env to be filled)",
]
