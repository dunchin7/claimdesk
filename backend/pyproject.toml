[project]
name = "claims-copilot-backend"
version = "0.1.0"
description = "ClaimDesk backend — AI claims co-pilot"
requires-python = ">=3.12"
readme = "../README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pgvector>=0.3.6",
    "litellm>=1.52",
    "instructor>=1.6",
    "langfuse>=2.50",
    "structlog>=24.4",
    "httpx>=0.27",
    "tenacity>=9.0",
    "jinja2>=3.1",
    "faker>=30.0",
    "python-dateutil>=2.9",
    "fastembed>=0.8.0",
    "xgboost>=3.2.0",
    "scikit-learn>=1.8.0",
    "langgraph>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "slowapi>=0.1.9",
    "sentry-sdk>=2.61.1",
    "pymupdf>=1.27.2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
    "mypy>=1.13",
    "ipython>=8.27",
    "types-python-dateutil>=2.9",
    "piexif>=1.1.3",
    "pandas>=3.0.3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
